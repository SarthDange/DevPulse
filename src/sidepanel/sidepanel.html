
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevPulse</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <div>
      <h1>DevPulse</h1>
      <p>Browser diagnostics</p>
    </div>
    <button id="clear-history" type="button">Clear history</button>
  </header>

  <main>
    <div class="status-row">
      <span id="event-count">0 events</span>
      <div class="toolbar">
        <button id="export-history" type="button">Export JSON</button>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </div>

    <div class="filters">
      <label class="sr-only" for="event-search">Search diagnostics</label>
      <input id="event-search" type="search" placeholder="Search messages or origins…">
      <label class="sr-only" for="type-filter">Filter by event type</label>
      <select id="type-filter">
        <option value="all">All event types</option>
        <option value="javascript_error">JavaScript errors</option>
        <option value="unhandled_rejection">Promise rejections</option>
        <option value="http_error">HTTP errors</option>
        <option value="network_error">Network errors</option>
      </select>
    </div>

    <p id="empty-state">No events recorded yet. Trigger a test error on a website.</p>
    <p id="no-matches" hidden>No events match your search and filter.</p>
    <p id="status" role="status" aria-live="polite"></p>

    <section id="event-list" aria-label="Diagnostic events"></section>

    <section id="analysis-panel" aria-labelledby="analysis-heading" hidden>
      <h2 id="analysis-heading">AI analysis</h2>
      <p id="analysis-status" role="status" aria-live="polite"></p>
      <div id="analysis-result" aria-live="polite"></div>
    </section>
  </main>

  <script src="../ai/gemini-client.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
